name: Backfill Listed Time

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many existing listings to check"
        required: true
        default: "25"

jobs:
  backfill-listed-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SCRAPE_HEADLESS: "true"
      BACKFILL_LISTED_TIME_LIMIT: ${{ inputs.limit }}
      BACKFILL_LISTED_TIME_REPORT: artifacts/listed-time-backfill.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run backfill:listed-time
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listed-time-backfill-report
          path: artifacts/listed-time-backfill.json
