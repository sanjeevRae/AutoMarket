name: Scrape Marketplace

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print raw listing cards returned by Facebook"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      target_mode:
        description: "Marketplace target mode"
        required: false
        default: "hybrid"
        type: choice
        options:
          - "search"
          - "category"
          - "hybrid"

concurrency:
  group: automarket-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        target_offset: [0, 8, 16, 24, 32, 40, 48, 56]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      MARKETPLACE_CITY_URL: ${{ vars.MARKETPLACE_CITY_URL || '' }}
      MARKETPLACE_URLS: ${{ vars.MARKETPLACE_URLS || '' }}
      FCM_TOKENS: ${{ secrets.FCM_TOKENS || '' }}
      FACEBOOK_COOKIES_JSON: ${{ secrets.FACEBOOK_COOKIES_JSON || '' }}
      SCRAPE_HEADLESS: "true"
      SCRAPE_MAX_ITEMS: "80"
      SCRAPE_SCROLL_STEPS: "8"
      SCRAPE_DRY_RUN: "false"
      SCRAPE_DEBUG: ${{ github.event.inputs.debug || 'false' }}
      SCRAPE_DETAIL_DATES: "true"
      RETENTION_DAYS: "30"
      MARKETPLACE_MAX_TARGETS: "8"
      MARKETPLACE_TARGET_OFFSET: ${{ matrix.target_offset }}
      MARKETPLACE_TARGET_MODE: ${{ github.event.inputs.target_mode || 'hybrid' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: |
          echo "Running scrape with offset=${MARKETPLACE_TARGET_OFFSET} maxTargets=${MARKETPLACE_MAX_TARGETS} mode=${MARKETPLACE_TARGET_MODE}"
          echo "Custom MARKETPLACE_URLS set: $([ -n \"${MARKETPLACE_URLS}\" ] && echo yes || echo no)"
          echo "Facebook cookies configured: $([ -n \"${FACEBOOK_COOKIES_JSON}\" ] && echo yes || echo no)"
      - run: npm run scrape
