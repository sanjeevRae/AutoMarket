name: Scrape Marketplace

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Print raw listing cards returned by Facebook"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: automarket-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        target_offset: [0, 6, 12, 18, 24, 30, 36, 42]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      MARKETPLACE_CITY_URL: ${{ secrets.MARKETPLACE_CITY_URL }}
      MARKETPLACE_URLS: ${{ secrets.MARKETPLACE_URLS }}
      FCM_TOKENS: ${{ secrets.FCM_TOKENS }}
      SCRAPE_HEADLESS: "true"
      SCRAPE_MAX_ITEMS: "80"
      SCRAPE_SCROLL_STEPS: "4"
      SCRAPE_DRY_RUN: "false"
      SCRAPE_DEBUG: ${{ github.event.inputs.debug || 'false' }}
      RETENTION_DAYS: "30"
      MARKETPLACE_MAX_TARGETS: "6"
      MARKETPLACE_TARGET_OFFSET: ${{ matrix.target_offset }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run scrape
